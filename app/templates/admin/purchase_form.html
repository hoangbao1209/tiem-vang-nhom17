{% extends "admin/base_admin.html" %}
{% block content %}
<div class="page-header">
  <h1>Lập Phiếu mua hàng</h1>
  <a class="btn btn-outline" href="{{ url_for('admin.purchases') }}">← Danh sách phiếu mua</a>
</div>

<form method="post" class="card">
  <div class="form-grid">
    <div class="form-group">
      <label>Nhà cung cấp *</label>
      <select name="MaNCC" required>
        <option value="">-- Chọn nhà cung cấp đang hợp tác --</option>
        {% for s in suppliers %}
          <option value="{{ s.MaNCC }}">NCC{{ '%03d'|format(s.MaNCC) }} – {{ s.TenNCC }} ({{ s.SoDienThoai or s.DiaChi }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Ngày lập phiếu *</label>
      <input type="date" name="NgayLap" value="{{ today }}" max="{{ today }}" required>
    </div>
    <div class="form-group">
      <label>Ghi chú</label>
      <input type="text" name="GhiChu" placeholder="Ghi chú lô hàng...">
    </div>
  </div>

  <div class="card-title" style="margin-top:16px;">
    <span>Chi tiết sản phẩm nhập kho</span>
    <button type="button" class="btn btn-outline btn-sm" onclick="addVoucherRow('purchase-items-body','purchase-row-tpl')">+ Thêm dòng sản phẩm</button>
  </div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th style="min-width:250px;">Sản phẩm</th>
          <th>Loại sản phẩm</th>
          <th>ĐVT</th>
          <th style="width:120px;">Số lượng</th>
          <th style="width:170px;">Đơn giá mua (₫)</th>
          <th class="text-right">Thành tiền</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="purchase-items-body">
        <tr>
          <td>
            <select name="MaSP" required>
              <option value="">-- Chọn sản phẩm --</option>
              {% for p in products %}
                <option value="{{ p.MaSP }}" data-loai="{{ p.TenLoaiSP }}" data-dvt="{{ p.TenDVT }}" data-giamua="{{ p.DonGiaMua|plain }}">
                  {{ p.MaCode or ('SP' ~ p.MaSP) }} – {{ p.TenSP }} (Tồn: {{ p.SoLuongTon }})
                </option>
              {% endfor %}
            </select>
          </td>
          <td class="cell-loai">—</td>
          <td class="cell-dvt">—</td>
          <td><input type="number" name="SoLuong" value="1" min="1" required></td>
          <td><input type="number" name="DonGia" value="0" min="0" step="1" required></td>
          <td class="text-right cell-thanhtien" style="font-weight:700;">0 ₫</td>
          <td><button type="button" class="btn btn-danger btn-sm" onclick="removeVoucherRow(this)">✕</button></td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th colspan="5" class="text-right">Tổng tiền phiếu mua:</th>
          <th class="text-right" id="voucher-total" style="font-size:1.15rem;color:var(--gold-600);">0 ₫</th>
          <th></th>
        </tr>
      </tfoot>
    </table>
  </div>

  <div style="margin-top:18px;display:flex;justify-content:flex-end;gap:10px;">
    <button type="submit" class="btn btn-primary">Lưu phiếu mua hàng</button>
  </div>
</form>

<template id="purchase-row-tpl">
  <tr>
    <td>
      <select name="MaSP" required>
        <option value="">-- Chọn sản phẩm --</option>
        {% for p in products %}
          <option value="{{ p.MaSP }}" data-loai="{{ p.TenLoaiSP }}" data-dvt="{{ p.TenDVT }}" data-giamua="{{ p.DonGiaMua|plain }}">
            {{ p.MaCode or ('SP' ~ p.MaSP) }} – {{ p.TenSP }} (Tồn: {{ p.SoLuongTon }})
          </option>
        {% endfor %}
      </select>
    </td>
    <td class="cell-loai">—</td>
    <td class="cell-dvt">—</td>
    <td><input type="number" name="SoLuong" value="1" min="1" required></td>
    <td><input type="number" name="DonGia" value="0" min="0" step="1" required></td>
    <td class="text-right cell-thanhtien" style="font-weight:700;">0 ₫</td>
    <td><button type="button" class="btn btn-danger btn-sm" onclick="removeVoucherRow(this)">✕</button></td>
  </tr>
</template>
{% endblock %}
