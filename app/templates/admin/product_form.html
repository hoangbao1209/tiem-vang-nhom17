{% extends "admin/base_admin.html" %}
{% block content %}
<div class="page-header">
  <h1>{{ 'Cập nhật sản phẩm ' ~ (sp.MaCode or ('#' ~ sp.MaSP)) if sp else 'Thêm sản phẩm mới' }}</h1>
  <a class="btn btn-outline" href="{{ url_for('admin.products_admin') }}">← Danh sách sản phẩm</a>
</div>

<form method="post" enctype="multipart/form-data" class="card" style="max-width:820px;">
  <div class="form-grid">
    <div class="form-group">
      <label>Mã sản phẩm (tự sinh nếu để trống)</label>
      <input type="text" name="MaCode" value="{{ sp.MaCode if sp and sp.MaCode else '' }}" placeholder="Ví dụ: SP020">
    </div>
    <div class="form-group">
      <label>Tên sản phẩm *</label>
      <input type="text" name="TenSP" value="{{ sp.TenSP if sp else '' }}" required placeholder="Ví dụ: Nhẫn vàng 18K đính đá...">
    </div>
    <div class="form-group">
      <label>Loại sản phẩm *</label>
      <select name="MaLoaiSP" required>
        <option value="">-- Chọn loại sản phẩm --</option>
        {% for c in categories %}
          <option value="{{ c.MaLoaiSP }}" {{ 'selected' if sp and sp.MaLoaiSP == c.MaLoaiSP else '' }}>
            {{ c.TenLoaiSP }} (ĐVT: {{ c.TenDVT }} — Lợi nhuận: {{ c.PhanTramLoiNhuan|plain }}%)
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Đơn giá mua gần nhất (₫)</label>
      <input type="number" name="DonGiaMua" value="{{ sp.DonGiaMua|plain if sp else 0 }}" min="0" step="1">
    </div>
    <div class="form-group">
      <label>Chất liệu</label>
      <input type="text" name="ChatLieu" value="{{ sp.ChatLieu if sp and sp.ChatLieu else '' }}" placeholder="Vàng 18K, Vàng 999.9, Bạc Ý 925...">
    </div>
    <div class="form-group">
      <label>Hàm lượng / Tuổi vàng</label>
      <input type="text" name="TuoiVang" value="{{ sp.TuoiVang if sp and sp.TuoiVang else '' }}" placeholder="750 (18K), 999.9 (24K), S925...">
    </div>
    <div class="form-group">
      <label>Trọng lượng tham khảo</label>
      <input type="text" name="TrongLuong" value="{{ sp.TrongLuong if sp and sp.TrongLuong else '' }}" placeholder="1 chỉ (3.75g), 2.8g...">
    </div>
    <div class="form-group">
      <label>Tình trạng kinh doanh</label>
      <select name="TinhTrang">
        <option value="Đang kinh doanh" {{ 'selected' if not sp or sp.TinhTrang == 'Đang kinh doanh' else '' }}>Đang kinh doanh</option>
        <option value="Ngừng kinh doanh" {{ 'selected' if sp and sp.TinhTrang == 'Ngừng kinh doanh' else '' }}>Ngừng kinh doanh</option>
      </select>
    </div>
    <div class="form-group">
      <label>Hình minh họa có sẵn</label>
      <select name="HinhAnhChon">
        {% for path, label in stock_images %}
          <option value="{{ path }}" {{ 'selected' if sp and sp.HinhAnh == path else '' }}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Tải ảnh sản phẩm từ máy (png, jpg, webp)</label>
      <input type="file" name="HinhAnhFile" accept=".png,.jpg,.jpeg,.gif,.webp">
    </div>
  </div>

  <div class="form-group">
    <label>Chính sách bảo hành &amp; Thu đổi</label>
    <input type="text" name="BaoHanh" value="{{ sp.BaoHanh if sp and sp.BaoHanh else '' }}" placeholder="Làm sạch siêu âm &amp; đánh bóng miễn phí trọn đời">
  </div>

  <div class="form-group">
    <label>Mô tả chi tiết sản phẩm</label>
    <textarea name="MoTa" rows="3" placeholder="Mô tả kiểu dáng, viên đá, giấy kiểm định, gợi ý sử dụng...">{{ sp.MoTa if sp and sp.MoTa else '' }}</textarea>
  </div>

  <div class="form-group">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
      <input type="checkbox" name="HienThi" value="1" {{ 'checked' if not sp or sp.HienThi else '' }} style="width:auto;">
      Hiển thị sản phẩm trên trang bán hàng cho khách (chỉ áp dụng khi Đang kinh doanh)
    </label>
  </div>

  <button type="submit" class="btn btn-primary">Lưu sản phẩm</button>
</form>
{% endblock %}
