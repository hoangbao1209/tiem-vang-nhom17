{% extends "admin/base_admin.html" %}
{% block content %}
<div class="page-header">
  <h1>Danh sách Nhà cung cấp</h1>
</div>

<div class="card">
  <form method="post" style="display:grid;grid-template-columns:1.4fr 1fr 1.6fr auto;gap:10px;margin-bottom:16px;">
    <input type="hidden" name="action" value="save">
    <input type="text" name="TenNCC" required placeholder="Tên nhà cung cấp mới...">
    <input type="text" name="SoDienThoai" placeholder="Số điện thoại">
    <input type="text" name="DiaChi" placeholder="Địa chỉ">
    <button type="submit" class="btn btn-primary">+ Thêm NCC</button>
  </form>

  <table class="table">
    <thead>
      <tr>
        <th>Mã</th>
        <th>Tên nhà cung cấp</th>
        <th>Số điện thoại</th>
        <th>Địa chỉ</th>
        <th class="text-center">Số phiếu mua</th>
        <th class="text-right">Tổng tiền mua</th>
        <th class="text-right">Thao tác</th>
      </tr>
    </thead>
    <tbody>
      {% for r in rows %}
        <tr>
          <form method="post">
            <input type="hidden" name="action" value="save">
            <input type="hidden" name="MaNCC" value="{{ r.MaNCC }}">
            <td>#{{ r.MaNCC }}</td>
            <td><input type="text" name="TenNCC" value="{{ r.TenNCC }}" required></td>
            <td><input type="text" name="SoDienThoai" value="{{ r.SoDienThoai or '' }}"></td>
            <td><input type="text" name="DiaChi" value="{{ r.DiaChi or '' }}"></td>
            <td class="text-center">{{ r.SoPhieu }}</td>
            <td class="text-right" style="font-weight:700;">{{ r.TongMua|vnd }}</td>
            <td class="text-right" style="white-space:nowrap;">
              <button type="submit" class="btn btn-outline btn-sm">Lưu</button>
              <button type="submit" name="action" value="delete" class="btn btn-danger btn-sm" onclick="return confirm('Xóa nhà cung cấp này?');">Xóa</button>
            </td>
          </form>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
