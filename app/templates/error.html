{% extends "base.html" %}
{% block title %}Lỗi {{ code }} – {{ store.TenCuaHang }}{% endblock %}
{% block content %}
<div class="container section">
  <div class="card text-center" style="max-width:520px;margin:40px auto;padding:36px;">
    <h1 style="font-size:3rem;margin:0;color:var(--gold-600);">{{ code }}</h1>
    <p style="font-size:1.1rem;margin:12px 0 24px;">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('shop.index') }}">Về trang chủ</a>
  </div>
</div>
{% endblock %}
