{% extends "admin/base_admin.html" %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Đổi mật khẩu tài khoản</h1>
    <div class="page-subtitle">Cập nhật mật khẩu cho tài khoản <strong>{{ g.user.TenDangNhap }}</strong> ({{ g.user.TenNV }}).</div>
  </div>
  <a class="btn btn-outline" href="{{ url_for('admin.dashboard') }}">← Quay lại Tổng quan</a>
</div>

<div class="card" style="max-width:480px;">
  <form method="post">
    <div class="form-group">
      <label>Mật khẩu hiện tại <span class="req">*</span></label>
      <input type="password" name="MatKhauCu" required autocomplete="current-password">
    </div>
    <div class="form-group">
      <label>Mật khẩu mới (tối thiểu 6 ký tự) <span class="req">*</span></label>
      <input type="password" name="MatKhauMoi" required minlength="6" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>Xác nhận mật khẩu mới <span class="req">*</span></label>
      <input type="password" name="XacNhan" required minlength="6" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary">Lưu mật khẩu mới</button>
  </form>
</div>
{% endblock %}
